name: Aggiorna calendario

on:
  schedule:
    # 06:00 UTC = 07:00 in inverno, 08:00 in estate (ora di Roma)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"

      - name: Installa Playwright e Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      # Se la pagina non è leggibile o gli eventi crollano, lo script termina con errore.
      # In quel caso il job fallisce e GitHub ti manda una mail. I file non vengono toccati.
      - name: Scarica orario e genera .ics
        run: node build.ts "" docs

      # Solo se il passo precedente fallisce: allega la pagina ricevuta alla run per il controllo.
      - name: Allega pagina ricevuta (solo in caso di errore)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pagina-debug
          path: pagina-debug.html
          if-no-files-found: ignore

      - name: Salva se ci sono cambiamenti
        run: |
          git config user.name "calendario-bot"
          git config user.email "calendario-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nessun cambiamento."
          else
            git commit -m "Aggiorna calendario"
            git push
          fi
